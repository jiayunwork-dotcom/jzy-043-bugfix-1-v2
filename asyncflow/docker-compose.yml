name: asyncflow

services:
  postgres:
    image: postgres:16-alpine
    container_name: asyncflow-postgres
    environment:
      POSTGRES_USER: asyncflow
      POSTGRES_PASSWORD: asyncflow
      POSTGRES_DB: asyncflow
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U asyncflow -d asyncflow"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: asyncflow-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    build:
      context: ./backend
    container_name: asyncflow-backend
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      HTTP_ADDR: ":8080"
      POSTGRES_DSN: "postgres://asyncflow:asyncflow@postgres:5432/asyncflow?sslmode=disable"
      REDIS_ADDR: "redis:6379"
      FAIRNESS_HIGH_WATERMARK: "5"
      DISPATCH_INTERVAL: "50ms"
      DELAY_SCAN_INTERVAL: "250ms"
      LEASE_SECONDS: "30"
      HEARTBEAT_TIMEOUT_SECS: "15"
      REAPER_INTERVAL: "2s"
      EMBEDDED_WORKER_ENABLED: "true"
      EMBEDDED_WORKER_SLOTS: "4"
      EMBEDDED_WORKER_NAME: "embedded-1"
    ports:
      - "8080:8080"

  frontend:
    build:
      context: ./frontend
    container_name: asyncflow-frontend
    depends_on:
      - backend
    environment:
      # Browser-facing API URL. On Linux the page reaches the backend through
      # the host-published port; override in .env for non-local setups.
      NUXT_PUBLIC_API_BASE: "http://localhost:8080"
      HOST: "0.0.0.0"
      PORT: "3000"
    ports:
      - "3000:3000"

volumes:
  pgdata:
  redisdata:
